<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Login – Spacenations Tools</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181D'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.4' fill='none' stroke='%2300D68F' stroke-width='1.6' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/app.css?v=light-2">

    <style>
        /* Seitenspezifisch: zentrierte Admin-Login-Karte */
        .auth-main {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 56px 18px 80px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 36px 32px 32px;
        }

        .auth-head {
            margin-bottom: 22px;
        }

        .auth-head h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .auth-head p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group { margin-bottom: 16px; }

        .login-button { width: 100%; margin-top: 10px; }

        /* System-Status-Zeile - JS setzt status-info info|success|error */
        .status-info {
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: 12.5px;
            font-weight: 500;
            text-align: center;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.22);
            color: #2563EB;
        }

        .status-info.success {
            background: var(--accent-soft);
            border-color: rgba(0, 168, 120, 0.3);
            color: var(--accent-strong);
        }

        .status-info.error {
            background: var(--danger-soft);
            border-color: rgba(217, 48, 37, 0.25);
            color: var(--danger);
        }

        /* Meldungen */
        .message {
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .message.error {
            background: var(--danger-soft);
            border: 1px solid rgba(217, 48, 37, 0.25);
            color: var(--danger);
        }

        .message.success {
            background: var(--accent-soft);
            border: 1px solid rgba(0, 168, 120, 0.3);
            color: var(--accent-strong);
        }

        /* Interne Diagnose-Links */
        .tools-links {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--line-soft);
            text-align: center;
        }

        .tools-links a {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            margin: 3px 4px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .tools-links a:hover {
            color: var(--text-primary);
            border-color: var(--line-strong);
        }

        @media (max-width: 540px) {
            .auth-card { padding: 28px 20px 24px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="wrap">
            <a href="index.html" class="wordmark">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4.4"/>
                        <ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)" opacity="0.55"/>
                    </svg>
                </span>
                <span><strong>Spacenations</strong><span class="thin"> Tools</span></span>
            </a>

            <nav class="header-auth">
                <a href="index.html" class="btn btn-ghost btn-sm">Zur Übersicht</a>
            </nav>
        </div>
    </header>

    <main class="auth-main">
        <div class="card auth-card">
            <div class="auth-head">
                <h1>Admin-Login</h1>
                <p>Nur für Administratoren.</p>
            </div>

            <div id="status-info" class="status-info">
                Initialisiere System...
            </div>

            <form id="admin-login-form">
                <div class="form-group field">
                    <label for="email">E-Mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="E-Mail-Adresse"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group field">
                    <label for="password">Passwort</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-solid btn-md login-button" id="login-btn">
                    Anmelden
                </button>
            </form>

            <div id="msg-error" class="message error"></div>
            <div id="msg-success" class="message success"></div>

        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth-manager.js"></script>

    <script>
        // Status-Updates
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status-info');
            statusEl.textContent = message;
            statusEl.className = `status-info ${type}`;
        }

        // Message-Funktionen
        function showError(msg) {
            const errorEl = document.getElementById('msg-error');
            const successEl = document.getElementById('msg-success');
            errorEl.innerHTML = msg;
            errorEl.style.display = 'block';
            successEl.style.display = 'none';
        }

        function showSuccess(msg) {
            const errorEl = document.getElementById('msg-error');
            const successEl = document.getElementById('msg-success');
            successEl.textContent = msg;
            successEl.style.display = 'block';
            errorEl.style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('msg-error').style.display = 'none';
            document.getElementById('msg-success').style.display = 'none';
        }

        // Super-Admin-Verifikation ausschließlich über Firestore (globalRole), kein Hardcoded-Fallback.
        async function verifySuperAdmin(user) {
            try {
                console.log('🔍 Prüfe Super-Admin-Status für:', user.email);
                const isSuperAdmin = await window.AuthAPI.checkSuperAdminStatus(user);
                console.log('Super-Admin-Status (Firestore):', isSuperAdmin);
                return isSuperAdmin;
            } catch (error) {
                console.error('❌ Super-Admin-Verifikation fehlgeschlagen:', error);
                throw new Error('Berechtigung konnte nicht überprüft werden.');
            }
        }

        // Login-Form Handler
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const button = document.getElementById('login-btn');
            const originalText = button.textContent;

            // Button deaktivieren
            button.disabled = true;
            button.textContent = 'Anmeldung läuft...';

            try {
                // Warten bis AuthAPI bereit ist
                updateStatus('Warte auf AuthAPI...', 'info');
                const authReady = await window.AuthAPI.waitForInit();

                if (!authReady) {
                    throw new Error('AuthAPI konnte nicht initialisiert werden');
                }

                updateStatus('Firebase bereit - Anmeldung läuft...', 'info');

                // Form-Daten holen
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    throw new Error('Bitte füllen Sie alle Felder aus');
                }

                // Login-Versuch (DIREKT mit Firebase Auth)
                const result = await window.AuthAPI.login(email, password);

                if (!result.success) {
                    throw new Error(result.error || 'Anmeldung fehlgeschlagen');
                }

                updateStatus('Anmeldung erfolgreich - Prüfe Berechtigung...', 'success');
                showSuccess('Anmeldung erfolgreich. Prüfe Berechtigung...');

                // Super-Admin-Status prüfen (mit Fallback)
                const isAuthorized = await verifySuperAdmin(result.user);

                if (!isAuthorized) {
                    // Nicht berechtigt - ABER NICHT AUSLOGGEN
                    throw new Error('Zugriff verweigert. Nur für Super-Admins.');
                }

                // Erfolgreich - Weiterleitung
                updateStatus('Berechtigung bestätigt. Weiterleitung...', 'success');
                showSuccess('Berechtigung bestätigt. Weiterleitung zum Admin-Dashboard...');

                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('Admin-Login Fehler:', error);
                updateStatus('Anmeldung fehlgeschlagen', 'error');

                let errorMessage = error.message || 'Ein Fehler ist aufgetreten';

                // Spezielle Behandlung für verschiedene Fehlertypen
                if (errorMessage.includes('Zugriff verweigert')) {
                    errorMessage += '<br><br><strong>Hinweis:</strong> Ihr Account wurde gefunden, aber Sie haben keine Admin-Berechtigung.';
                } else if (errorMessage.includes('AuthAPI konnte nicht initialisiert werden')) {
                    errorMessage += '<br><br><strong>System-Problem:</strong> Bitte später erneut versuchen.';
                } else if (errorMessage.includes('Kein Account') || errorMessage.includes('user-not-found')) {
                    errorMessage += '<br><br><strong>Benutzer-Problem:</strong> Kein Admin-Account gefunden.';
                }

                showError(errorMessage);

            } finally {
                // Button wieder aktivieren
                button.disabled = false;
                button.textContent = originalText;
            }
        });

        // Initialisierung beim Laden
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                updateStatus('Initialisiere Firebase...', 'info');

                // Warten bis Firebase bereit ist
                const firebaseReady = await window.FirebaseConfig.waitForReadyWithTimeout(10000);

                if (firebaseReady) {
                    updateStatus('Firebase bereit...', 'info');

                    // Warten bis AuthAPI bereit ist
                    const authReady = await window.AuthAPI.waitForInit();

                    if (authReady) {
                        const firestoreStatus = window.AuthAPI.getFirestoreStatus();
                        updateStatus(
                            `System bereit. Firestore: ${firestoreStatus ? 'Verfügbar' : 'Fallback-Modus'}`,
                            'success'
                        );

                        // Prüfe ob bereits angemeldet
                        if (window.AuthAPI.isLoggedIn()) {
                            const currentUser = window.AuthAPI.getCurrentUser();
                            const userData = window.AuthAPI.getUserData();

                            if (userData?.globalRole === 'global_admin') {
                                updateStatus('Bereits als Admin angemeldet', 'success');
                                showSuccess(`Bereits angemeldet als ${userData?.username || currentUser.email}. Weiterleitung...`);

                                setTimeout(() => {
                                    window.location.href = 'admin-dashboard.html';
                                }, 2000);
                            } else {
                                updateStatus('Angemeldet, aber keine Admin-Berechtigung', 'error');
                                showError('Sie sind angemeldet, haben aber keine Admin-Berechtigung.');
                            }
                        }

                    } else {
                        updateStatus('AuthAPI-Initialisierung fehlgeschlagen', 'error');
                        showError('Auth-System konnte nicht initialisiert werden.');
                    }

                } else {
                    updateStatus('Firebase-Initialisierung fehlgeschlagen', 'error');
                    showError('Firebase konnte nicht initialisiert werden.');
                }

            } catch (error) {
                console.error('Initialisierung fehlgeschlagen:', error);
                updateStatus('Initialisierung fehlgeschlagen', 'error');
                showError('System-Initialisierung fehlgeschlagen: ' + error.message);
            }

            // Focus auf E-Mail-Feld
            setTimeout(() => {
                document.getElementById('email').focus();
            }, 100);
        });
    </script>
</body>
</html>
