<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allianz-Dashboard – Spacenations Tools</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181D'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.4' fill='none' stroke='%2300D68F' stroke-width='1.6' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/app.css?v=light-2">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .loading-container {
            width: 100%;
            max-width: 480px;
            padding: 36px 32px;
            text-align: center;
        }

        .loading-badge {
            width: 52px;
            height: 52px;
            margin: 0 auto 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-soft);
            border: 1px solid rgba(0, 168, 120, 0.2);
            color: var(--accent-strong);
            animation: pulse 2s infinite;
        }

        .loading-badge svg {
            width: 26px; height: 26px; stroke: currentColor; fill: none;
            stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
        }

        .loading-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 6px; }
        .loading-subtitle { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 24px; }

        .loading-progress {
            width: 100%; height: 6px;
            background: #EEF0F3;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .loading-progress-bar {
            height: 100%; width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.5s ease;
        }

        .loading-steps { text-align: left; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

        .loading-step {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            background: #F7F8FA;
            border: 1px solid var(--line-soft);
            border-left: 3px solid var(--line);
            border-radius: 10px;
            font-size: 13.5px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .loading-step.active { border-left-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
        .loading-step.completed { border-left-color: var(--accent); background: rgba(0, 168, 120, 0.06); color: var(--text-primary); }

        .loading-step-icon { display: flex; }
        .loading-step-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .loading-step-text { flex: 1; }

        .loading-error {
            background: var(--danger-soft);
            border: 1px solid rgba(217, 48, 37, 0.25);
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 4px;
            color: var(--danger);
            font-size: 13.5px;
            font-weight: 500;
        }

        .loading-success {
            background: var(--accent-soft);
            border: 1px solid rgba(0, 168, 120, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 4px;
            color: var(--accent-strong);
            font-size: 13.5px;
            font-weight: 500;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
</head>
<body>
    <div class="card loading-container">
        <div class="loading-badge">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="8.2" r="3.2"/><path d="M3.2 19.4c.6-3.1 3-5 5.8-5s5.2 1.9 5.8 5"/><path d="M16.2 5.6a3.2 3.2 0 0 1 0 5.2"/><path d="M17.6 14.6c1.9.7 3.1 2.4 3.5 4.6"/></svg>
        </div>
        <h1 class="loading-title">Allianz-Dashboard</h1>
        <p class="loading-subtitle">Lade deine Allianz-Informationen...</p>

        <div class="loading-progress">
            <div class="loading-progress-bar" id="progress-bar"></div>
        </div>

        <div class="loading-steps">
            <div class="loading-step" id="step-1">
                <div class="loading-step-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
                <div class="loading-step-text">Benutzer identifizieren</div>
            </div>
            <div class="loading-step" id="step-2">
                <div class="loading-step-icon"><svg viewBox="0 0 24 24"><path d="M13 2L4.5 12.5H11l-1 9.5 8.5-11H12l1-9z"/></svg></div>
                <div class="loading-step-text">Firebase verbinden</div>
            </div>
            <div class="loading-step" id="step-3">
                <div class="loading-step-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.2" r="3.2"/><path d="M3.2 19.4c.6-3.1 3-5 5.8-5s5.2 1.9 5.8 5"/></svg></div>
                <div class="loading-step-text">Allianz suchen</div>
            </div>
            <div class="loading-step" id="step-4">
                <div class="loading-step-icon"><svg viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></div>
                <div class="loading-step-text">Weiterleitung vorbereiten</div>
            </div>
        </div>

        <div id="status-message" class="loading-subtitle" style="margin-bottom:0;"></div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth-manager.js"></script>

    <!-- Alliance Redirect Script -->
    <script src="js/alliance-redirect.js"></script>

    <script>
        // Loading-Animation
        let currentStep = 0;
        const steps = ['step-1', 'step-2', 'step-3', 'step-4'];
        const messages = [
            'Identifiziere Benutzer...',
            'Verbinde mit Firebase...',
            'Suche Allianz-Informationen...',
            'Bereite Weiterleitung vor...'
        ];

        function updateStep(stepIndex, status = 'active') {
            // Alle Schritte zurücksetzen
            steps.forEach((stepId, index) => {
                const step = document.getElementById(stepId);
                step.className = 'loading-step';
                if (index < stepIndex) {
                    step.className = 'loading-step completed';
                } else if (index === stepIndex) {
                    step.className = `loading-step ${status}`;
                }
            });

            // Progress Bar aktualisieren
            const progress = ((stepIndex + 1) / steps.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';

            // Status-Message aktualisieren
            if (stepIndex < messages.length) {
                document.getElementById('status-message').textContent = messages[stepIndex];
            }
        }

        function showError(message) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = `<div class="loading-error">${message}</div>`;
        }

        function showSuccess(message) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = `<div class="loading-success">${message}</div>`;
        }

        // Override der AllianceRedirectManager Methode für bessere UX (Ladeschritte)
        window.AllianceRedirectManager.prototype.initialize = async function() {
            try {
                updateStep(0);

                await window.AuthAPI.waitForInit();
                this.currentUser = window.AuthAPI.getCurrentUser();
                console.log('👤 Identifizierter Benutzer:', this.currentUser?.email);
                if (!this.currentUser) {
                    showError('Nicht angemeldet. Bitte melde dich an.');
                    setTimeout(() => this.redirectToLogin(), 2000);
                    return;
                }

                updateStep(1);
                await window.FirebaseConfig.waitForReady();

                updateStep(2);
                console.log('🏰 Lade User-Allianz...');
                const membership = await this.loadUserMembership();

                updateStep(3);

                if (membership) {
                    console.log('✅ Allianz-Mitgliedschaft gefunden:', membership.allianceId);
                    showSuccess('Weiterleitung zum Allianz-Dashboard...');
                    setTimeout(() => this.redirectToAllianceDashboard(membership), 1000);
                } else {
                    console.log('❌ Keine Allianz gefunden');
                    showError('Du gehörst keiner Allianz an.');
                    setTimeout(() => this.redirectToUserDashboard(), 2000);
                }

            } catch (error) {
                console.error('❌ Fehler:', error);
                showError('Fehler beim Laden: ' + error.message);
                setTimeout(() => this.redirectToUserDashboard(), 2000);
            }
        };

        // Starte den Redirect-Prozess
        document.addEventListener('DOMContentLoaded', () => {
            updateStep(0);
        });
    </script>
</body>
</html>
