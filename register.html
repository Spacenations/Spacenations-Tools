<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung – Spacenations Tools</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181D'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.4' fill='none' stroke='%2300D68F' stroke-width='1.6' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/app.css?v=light-2">

    <style>
        /* Seitenspezifisch: zentrierte Auth-Karte */
        .auth-main {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 56px 18px 80px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            padding: 36px 32px 32px;
        }

        .auth-head {
            margin-bottom: 28px;
        }

        .auth-head h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .auth-head p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group { margin-bottom: 18px; }

        /* Passwortstärke */
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: #EEF0F3;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .password-strength-bar.weak   { width: 33%;  background: var(--danger); }
        .password-strength-bar.medium { width: 66%;  background: #DE8500; }
        .password-strength-bar.strong { width: 100%; background: var(--accent); }

        .password-strength-text {
            margin-top: 5px;
            font-size: 11.5px;
            color: var(--text-tertiary);
        }

        /* Checkbox-Zeile */
        .form-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 4px 0 22px;
        }

        .form-checkbox input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin-top: 2px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .form-checkbox label {
            flex: 1;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.55;
            cursor: pointer;
        }

        .form-checkbox a {
            color: var(--accent-strong);
            text-decoration: none;
            font-weight: 500;
        }

        .form-checkbox a:hover { text-decoration: underline; }

        .register-button { width: 100%; }

        /* Meldungen */
        .message {
            margin-bottom: 18px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 500;
            display: none;
        }

        .message.error {
            background: var(--danger-soft);
            border: 1px solid rgba(217, 48, 37, 0.25);
            color: var(--danger);
        }

        .message.success {
            background: var(--accent-soft);
            border: 1px solid rgba(0, 168, 120, 0.3);
            color: var(--accent-strong);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid var(--line-soft);
            color: var(--text-secondary);
            font-size: 13.5px;
        }

        .login-link a {
            color: var(--accent-strong);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover { text-decoration: underline; }

        @media (max-width: 540px) {
            .auth-card { padding: 28px 20px 24px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="wrap">
            <a href="index.html" class="wordmark">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4.4"/>
                        <ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)" opacity="0.55"/>
                    </svg>
                </span>
                <span><strong>Spacenations</strong><span class="thin"> Tools</span></span>
            </a>

            <nav class="header-auth">
                <a href="index.html" class="btn btn-ghost btn-sm">Zur Übersicht</a>
                <a href="https://beta4.game.spacenations.eu/" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Zum Spiel <span class="ext">↗</span></a>
            </nav>
        </div>
    </header>

    <main class="auth-main">
        <div class="card auth-card">
            <div class="auth-head">
                <h1>Konto erstellen</h1>
                <p>In einer Minute startklar – kostenlos für alle Spieler.</p>
            </div>

            <div id="msg-error" class="message error"></div>
            <div id="msg-success" class="message success"></div>

            <form id="register-form">
                <div class="form-row">
                    <div class="form-group field">
                        <label for="firstName">Vorname</label>
                        <input
                            type="text"
                            id="firstName"
                            placeholder="Max"
                            required
                            autocomplete="given-name"
                        >
                    </div>

                    <div class="form-group field">
                        <label for="lastName">Nachname</label>
                        <input
                            type="text"
                            id="lastName"
                            placeholder="Mustermann"
                            required
                            autocomplete="family-name"
                        >
                    </div>
                </div>

                <div class="form-group field">
                    <label for="email">E-Mail-Adresse</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="max@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group field">
                    <label for="password">Passwort</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strength-bar"></div>
                    </div>
                    <div class="password-strength-text" id="strength-text"></div>
                </div>

                <div class="form-group field">
                    <label for="confirmPassword">Passwort bestätigen</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="••••••••"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        Ich akzeptiere die <a href="#" onclick="event.preventDefault(); alert('AGB werden noch erstellt');">Nutzungsbedingungen</a> und die <a href="#" onclick="event.preventDefault(); alert('Datenschutzerklärung wird noch erstellt');">Datenschutzerklärung</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-accent btn-md register-button" id="register-btn">
                    Konto erstellen
                </button>
            </form>

            <div class="login-link">
                Bereits ein Konto? <a href="index.html">Jetzt anmelden</a>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/logger.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth-manager.js"></script>

    <script>
        // Message functions
        function showError(msg) {
            const errorEl = document.getElementById('msg-error');
            const successEl = document.getElementById('msg-success');
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            successEl.style.display = 'none';

            // Auto-hide after 5 seconds
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        function showSuccess(msg) {
            const errorEl = document.getElementById('msg-error');
            const successEl = document.getElementById('msg-success');
            successEl.textContent = msg;
            successEl.style.display = 'block';
            errorEl.style.display = 'none';
        }

        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');

            if (!password) {
                strengthBar.className = 'password-strength-bar';
                strengthText.textContent = '';
                return;
            }

            // Check length
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;

            // Check for different character types
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            // Update UI
            if (strength <= 2) {
                strengthBar.className = 'password-strength-bar weak';
                strengthText.textContent = 'Schwaches Passwort';
                strengthText.style.color = 'var(--danger)';
            } else if (strength <= 4) {
                strengthBar.className = 'password-strength-bar medium';
                strengthText.textContent = 'Mittleres Passwort';
                strengthText.style.color = '#DE8500';
            } else {
                strengthBar.className = 'password-strength-bar strong';
                strengthText.textContent = 'Starkes Passwort';
                strengthText.style.color = 'var(--accent-strong)';
            }
        }

        // Password input listener
        document.getElementById('password').addEventListener('input', function(e) {
            checkPasswordStrength(e.target.value);
        });

        // Form validation
        function validateForm() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            if (!firstName || !lastName) {
                showError('Bitte geben Sie Ihren vollständigen Namen ein');
                return false;
            }

            if (!email || !email.includes('@')) {
                showError('Bitte geben Sie eine gültige E-Mail-Adresse ein');
                return false;
            }

            if (password.length < 6) {
                showError('Das Passwort muss mindestens 6 Zeichen lang sein');
                return false;
            }

            if (password !== confirmPassword) {
                showError('Die Passwörter stimmen nicht überein');
                return false;
            }

            if (!terms) {
                showError('Bitte akzeptieren Sie die Nutzungsbedingungen');
                return false;
            }

            return true;
        }

        // Handle registration
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            const button = document.getElementById('register-btn');
            const originalText = button.textContent;

            // Disable button and show loading
            button.disabled = true;
            button.textContent = 'Registrierung läuft...';

            try {
                // Wait for auth to be ready
                await window.AuthAPI.waitForInit();

                // Get form values
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                // Create user data
                const userData = {
                    firstName: firstName,
                    lastName: lastName,
                    displayName: `${firstName} ${lastName}`,
                    email: email
                };

                // Register user
                const result = await window.AuthAPI.register(email, password, userData.displayName);

                if (!result.success) {
                    throw new Error(result.error || 'Registrierung fehlgeschlagen');
                }

                // Show success message
                showSuccess('Konto erfolgreich erstellt! Weiterleitung zum Dashboard...');

                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = 'user-dashboard.html';
                }, 2000);

            } catch (error) {
                console.error('Registration error:', error);

                // Handle specific Firebase errors
                let errorMessage = 'Ein Fehler ist aufgetreten';
                if (error.message.includes('email-already-in-use')) {
                    errorMessage = 'Diese E-Mail-Adresse wird bereits verwendet';
                } else if (error.message.includes('weak-password')) {
                    errorMessage = 'Das Passwort ist zu schwach';
                } else if (error.message.includes('invalid-email')) {
                    errorMessage = 'Ungültige E-Mail-Adresse';
                } else if (error.message) {
                    errorMessage = error.message;
                }

                showError(errorMessage);
            } finally {
                // Re-enable button
                button.disabled = false;
                button.textContent = originalText;
            }
        });

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await window.AuthAPI.waitForInit();

                // Bereits angemeldet? Nur freundlich hinweisen, NICHT zwangsweise weiterleiten.
                window.AuthAPI.onAuthStateChange((user) => {
                    if (user) {
                        showSuccess('Du bist bereits angemeldet – du kannst jederzeit zur Übersicht oder zum Dashboard wechseln.');
                    }
                });
            } catch (error) {
                console.error('Auth init error:', error);
            }
        });

        // Focus first input on load
        window.addEventListener('load', () => {
            document.getElementById('firstName').focus();
        });
    </script>
</body>
</html>
