<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spionagebericht – Details – Spacenations Tools</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181D'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.4' fill='none' stroke='%2300D68F' stroke-width='1.6' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/app.css?v=light-2">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* Seitenspezifisch: Detail-Abschnitte, vom JS per innerHTML erzeugt */
        .tool-main { padding-bottom: 64px; }

        .page-head { flex-wrap: wrap; }
        .page-head .head-actions { margin-left: auto; display: flex; gap: 8px; }

        /* JS-generierte Button-Varianten */
        .btn.primary { background: var(--accent); color: #FFFFFF; }
        .btn.primary:hover { background: #009068; }
        .btn.secondary {
            background: var(--card);
            color: var(--text-primary);
            border-color: var(--line);
            box-shadow: var(--shadow-sm);
        }
        .btn.secondary:hover { border-color: var(--line-strong); }

        .loading {
            text-align: center;
            padding: 56px 24px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            margin-top: 22px;
            text-align: center;
            padding: 40px 24px;
            color: var(--danger);
            background: var(--danger-soft);
            border: 1px solid rgba(217, 48, 37, 0.25);
            border-radius: 14px;
        }

        .error h3 { font-size: 16px; margin-bottom: 8px; }
        .error .btn { margin-top: 14px; }

        /* Detail-Abschnitte (JS-generiert) */
        .detail-section {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            padding: 22px 24px;
            margin-bottom: 14px;
        }

        .detail-section h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2px 24px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line-soft);
            font-size: 13.5px;
        }

        .info-label { color: var(--text-secondary); }
        .info-value { color: var(--text-primary); font-weight: 500; text-align: right; }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .resource-item {
            background: #F7F8FA;
            border: 1px solid var(--line-soft);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .resource-name { color: var(--accent-strong); font-weight: 600; font-size: 12.5px; margin-bottom: 4px; }
        .resource-amount { color: var(--text-primary); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

        .buildings-list, .research-list, .ships-list {
            display: grid;
            gap: 8px;
        }

        .building-item, .research-item, .ship-item {
            background: #F7F8FA;
            border: 1px solid var(--line-soft);
            border-radius: 10px;
            padding: 11px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
        }

        .item-name { color: var(--text-primary); font-weight: 500; }

        .item-level {
            color: var(--accent-strong);
            font-weight: 600;
            background: var(--accent-soft);
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 12px;
        }

        .threat-level {
            padding: 3px 11px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 12px;
        }

        .threat-level.very_low  { background: rgba(11, 158, 110, 0.14); color: #0B7A56; }
        .threat-level.low       { background: rgba(52, 211, 153, 0.16); color: #0B8A5E; }
        .threat-level.medium    { background: rgba(245, 158, 11, 0.16); color: #B26A00; }
        .threat-level.high      { background: rgba(249, 115, 22, 0.16); color: #C2570A; }
        .threat-level.very_high { background: rgba(217, 48, 37, 0.12); color: #D93025; }

        .empty-state {
            text-align: center;
            padding: 28px;
            color: var(--text-tertiary);
            font-size: 13.5px;
        }

        .empty-state h3 { color: var(--text-secondary); font-size: 14px; margin-bottom: 6px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="wrap">
            <a href="index.html?stay=true" class="wordmark">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4.4"/>
                        <ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)" opacity="0.55"/>
                    </svg>
                </span>
                <span><strong>Spacenations</strong><span class="thin"> Tools</span></span>
            </a>

            <nav class="header-auth">
                <a href="user-dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
                <a href="spy-database.html" class="btn btn-ghost btn-sm">Spionage-DB</a>
                <span class="header-divider"></span>
                <a href="logout-all.html" class="btn btn-outline btn-sm">Abmelden</a>
            </nav>
        </div>
    </header>

    <main class="wrap tool-main">
        <div class="page-head">
            <span class="tool-icon tint-indigo">
                <svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
            </span>
            <div>
                <h1>Spionagebericht</h1>
                <p>Detailansicht eines gespeicherten Berichts.</p>
            </div>
            <div class="head-actions">
                <a href="spy-database.html" class="btn btn-outline btn-sm">Zurück zur Datenbank</a>
                <a href="spy-report-input.html" class="btn btn-accent btn-sm">Neuer Bericht</a>
            </div>
        </div>

        <div id="loading-state" class="loading">
            <div class="spinner"></div>
            <p>Lade Spionagebericht...</p>
        </div>

        <div id="error-state" class="error" style="display: none;">
            <h3>Fehler</h3>
            <p id="error-message">Bericht konnte nicht geladen werden.</p>
            <button class="btn primary" onclick="location.reload()">Erneut versuchen</button>
        </div>

        <div id="report-details" style="display: none;">
            <!-- Report Details werden hier eingefügt -->
        </div>
    </main>

    <!-- Firebase Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/session-manager.js"></script>
    <script src="js/auth-manager.js"></script>
    <script src="js/firebase-sync.js"></script>
    <script src="js/spy-report-parser.js?v=2"></script>
    <script src="js/spy-database-manager.js?v=6"></script>

    <script>
        let currentReport = null;

        // URL Parameter extrahieren
        const urlParams = new URLSearchParams(window.location.search);
        const reportId = urlParams.get('id');

        // Initialisierung
        document.addEventListener('DOMContentLoaded', async () => {
            if (!reportId) {
                showError('Keine Report-ID angegeben');
                return;
            }

            await loadReportDetails(reportId);
        });

        async function loadReportDetails(reportId) {
            try {
                showLoading();

                console.log('📋 Lade Report Details für ID:', reportId);
                currentReport = await window.SpyDatabaseAPI.getReport(reportId);

                if (!currentReport) {
                    throw new Error('Report nicht gefunden');
                }

                displayReportDetails(currentReport);
                hideLoading();

            } catch (error) {
                console.error('❌ Fehler beim Laden der Report Details:', error);
                showError('Fehler beim Laden des Reports: ' + error.message);
            }
        }

        function displayReportDetails(report) {
            const container = document.getElementById('report-details');

            // Datum formatieren
            const date = report.createdAt?.toDate ?
                report.createdAt.toDate() :
                new Date(report.createdAt || report.timestamp);
            const formattedDate = date.toLocaleString('de-DE');

            // Bedrohungsstufe formatieren
            const threatLevel = window.SpyReportAPI?.formatThreatLevel ?
                window.SpyReportAPI.formatThreatLevel(report.threatLevel) :
                { icon: '⚠️', text: report.threatLevel };

            container.innerHTML = `
                <!-- Grunddaten -->
                <div class="detail-section">
                    <h2>📋 Grunddaten</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">Spieler:</span>
                            <span class="info-value">${report.playerName || report.player?.name || 'Unbekannt'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Planet:</span>
                            <span class="info-value">${report.planetName || report.planet?.name || 'Unbekannt'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Koordinaten:</span>
                            <span class="info-value">${report.planetCoordinates || report.planet?.coordinates || 'Unbekannt'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Allianz:</span>
                            <span class="info-value">${report.player?.allianceName || 'Keine'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Erstellt am:</span>
                            <span class="info-value">${formattedDate}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Bedrohungsstufe:</span>
                            <span class="info-value">
                                <span class="threat-level ${report.threatLevel}">
                                    ${threatLevel.icon} ${threatLevel.text}
                                </span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Ressourcen -->
                ${renderResourcesSection(report.resources)}

                <!-- Gebäude -->
                ${renderBuildingsSection(report.buildings)}

                <!-- Forschung -->
                ${renderResearchSection(report.research || report.player?.research)}

                <!-- Schiffe -->
                ${renderShipsSection(report.shipTypes || report.player?.shipTypes)}

                <!-- Statistiken -->
                ${renderStatisticsSection(report.statistics)}

                <!-- Original URL -->
                <div class="detail-section">
                    <h2>🔗 Original Report</h2>
                    <div class="info-item">
                        <span class="info-label">URL:</span>
                        <span class="info-value">
                            <a href="${report.originalUrl}" target="_blank" class="btn secondary">
                                Original öffnen
                            </a>
                        </span>
                    </div>
                </div>
            `;

            container.style.display = 'block';
        }

        function renderResourcesSection(resources) {
            if (!resources) return '';

            const resourceItems = [];

            // Hauptressourcen
            const mainResources = [
                { key: 'fe', name: 'FE', value: resources.fe },
                { key: 'si', name: 'Si', value: resources.si },
                { key: 'c', name: 'C', value: resources.c },
                { key: 'water', name: 'Wasser', value: resources.water },
                { key: 'oxygen', name: 'Sauerstoff', value: resources.oxygen },
                { key: 'hydrogen', name: 'Wasserstoff', value: resources.hydrogen }
            ];

            mainResources.forEach(resource => {
                if (resource.value) {
                    const amount = resource.value.formatted || resource.value.amount || resource.value || '0';
                    resourceItems.push(`
                        <div class="resource-item">
                            <div class="resource-name">${resource.name}</div>
                            <div class="resource-amount">${amount}</div>
                        </div>
                    `);
                }
            });

            // Zusätzliche Ressourcen
            if (resources.additional && Array.isArray(resources.additional)) {
                resources.additional.forEach(resource => {
                    resourceItems.push(`
                        <div class="resource-item">
                            <div class="resource-name">${resource.name}</div>
                            <div class="resource-amount">${resource.formatted || resource.amount || '0'}</div>
                        </div>
                    `);
                });
            }

            if (resourceItems.length === 0) {
                return '<div class="detail-section"><h2>💎 Ressourcen</h2><div class="empty-state"><p>Keine Ressourcen-Daten verfügbar</p></div></div>';
            }

            return `
                <div class="detail-section">
                    <h2>💎 Ressourcen</h2>
                    <div class="resources-grid">
                        ${resourceItems.join('')}
                    </div>
                </div>
            `;
        }

        function renderBuildingsSection(buildings) {
            if (!buildings || (Array.isArray(buildings) && buildings.length === 0)) {
                return '<div class="detail-section"><h2>🏗️ Gebäude</h2><div class="empty-state"><p>Keine Gebäude-Daten verfügbar</p></div></div>';
            }

            const buildingItems = [];

            if (Array.isArray(buildings)) {
                buildings.forEach(building => {
                    buildingItems.push(`
                        <div class="building-item">
                            <span class="item-name">${building.name || 'Unbekanntes Gebäude'}</span>
                            <span class="item-level">Stufe ${building.level || 0}</span>
                        </div>
                    `);
                });
            } else {
                // Falls buildings ein Objekt ist
                Object.entries(buildings).forEach(([name, level]) => {
                    buildingItems.push(`
                        <div class="building-item">
                            <span class="item-name">${name}</span>
                            <span class="item-level">Stufe ${level}</span>
                        </div>
                    `);
                });
            }

            return `
                <div class="detail-section">
                    <h2>🏗️ Gebäude (${buildingItems.length})</h2>
                    <div class="buildings-list">
                        ${buildingItems.join('')}
                    </div>
                </div>
            `;
        }

        function renderResearchSection(research) {
            if (!research || (Array.isArray(research) && research.length === 0)) {
                return '<div class="detail-section"><h2>🔬 Forschung</h2><div class="empty-state"><p>Keine Forschungs-Daten verfügbar</p></div></div>';
            }

            const researchItems = [];

            if (Array.isArray(research)) {
                research.forEach(item => {
                    researchItems.push(`
                        <div class="research-item">
                            <span class="item-name">${item.name || 'Unbekannte Forschung'}</span>
                            <span class="item-level">Stufe ${item.level || 0}</span>
                        </div>
                    `);
                });
            } else {
                // Falls research ein Objekt ist
                Object.entries(research).forEach(([name, level]) => {
                    researchItems.push(`
                        <div class="research-item">
                            <span class="item-name">${name}</span>
                            <span class="item-level">Stufe ${level}</span>
                        </div>
                    `);
                });
            }

            return `
                <div class="detail-section">
                    <h2>🔬 Forschung (${researchItems.length})</h2>
                    <div class="research-list">
                        ${researchItems.join('')}
                    </div>
                </div>
            `;
        }

        function renderShipsSection(ships) {
            if (!ships || (Array.isArray(ships) && ships.length === 0)) {
                return '<div class="detail-section"><h2>🚀 Schiffe</h2><div class="empty-state"><p>Keine Schiffs-Daten verfügbar</p></div></div>';
            }

            const shipItems = [];

            if (Array.isArray(ships)) {
                ships.forEach(ship => {
                    shipItems.push(`
                        <div class="ship-item">
                            <span class="item-name">${ship.name || 'Unbekanntes Schiff'}</span>
                            <span class="item-level">${ship.count || 0} Stück</span>
                        </div>
                    `);
                });
            }

            return `
                <div class="detail-section">
                    <h2>🚀 Schiffe (${shipItems.length})</h2>
                    <div class="ships-list">
                        ${shipItems.join('')}
                    </div>
                </div>
            `;
        }

        function renderStatisticsSection(statistics) {
            if (!statistics) return '';

            return `
                <div class="detail-section">
                    <h2>📊 Statistiken</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">Gesamt Angriffsstärke:</span>
                            <span class="info-value">${Math.round(statistics.totalAttackPower || 0).toLocaleString()}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Gesamt Verteidigung:</span>
                            <span class="info-value">${Math.round(statistics.totalDefensePower || 0).toLocaleString()}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Gesamt Ressourcen:</span>
                            <span class="info-value">${Math.round(statistics.totalResources || 0).toLocaleString()}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Ø Forschungslevel:</span>
                            <span class="info-value">${Math.round(statistics.averageResearchLevel || 0)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Ø Gebäudelevel:</span>
                            <span class="info-value">${Math.round(statistics.averageBuildingLevel || 0)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Flottenanzahl:</span>
                            <span class="info-value">${statistics.fleetCount || 0}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function showLoading() {
            document.getElementById('loading-state').style.display = 'block';
            document.getElementById('error-state').style.display = 'none';
            document.getElementById('report-details').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading-state').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-state').style.display = 'block';
            document.getElementById('report-details').style.display = 'none';
        }
    </script>

    <!-- Global Footer Loader -->
    <script src="js/global-footer-loader.js"></script>
</body>
</html>
