<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProximaDB – Spacenations Tools</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181D'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.4' fill='none' stroke='%2300D68F' stroke-width='1.6' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/app.css?v=light-2">

    <style>
        /* Seitenspezifisch: Live-Daten-Tabelle mit KPI-Zeile */
        .tool-main { padding-bottom: 64px; }

        .page-head { flex-wrap: wrap; }
        .page-head .head-actions { margin-left: auto; }

        .data-card { margin-top: 22px; padding: 0; overflow: hidden; }

        .loading {
            text-align: center;
            padding: 64px 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .error {
            margin: 24px;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(217, 48, 37, 0.25);
            background: var(--danger-soft);
            color: var(--danger);
            text-align: center;
            font-size: 14px;
        }

        .error h3 { font-size: 15px; margin-bottom: 8px; }
        .error p { margin-bottom: 6px; }
        .error .refresh-btn { margin-top: 12px; }

        /* KPI-Zeile */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1px;
            background: var(--line-soft);
            border-bottom: 1px solid var(--line-soft);
        }

        .stat {
            background: var(--card);
            padding: 20px 24px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
            margin-bottom: 3px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        /* Tabelle */
        .table-container {
            padding: 8px 24px 16px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 11px 12px;
            text-align: left;
            border-bottom: 1px solid var(--line-soft);
            font-size: 13.5px;
        }

        th {
            color: var(--text-tertiary);
            font-weight: 600;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr:hover { background: #FAFBFC; }

        td code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px;
            background: #F2F4F6;
            padding: 2px 7px;
            border-radius: 6px;
            color: var(--text-secondary);
        }

        .week-badge {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--accent-strong);
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .score-high   { color: var(--accent-strong); font-weight: 600; font-variant-numeric: tabular-nums; }
        .score-medium { color: #B26A00; font-weight: 600; font-variant-numeric: tabular-nums; }
        .score-low    { color: var(--danger); font-weight: 600; font-variant-numeric: tabular-nums; }

        /* Info-Zeile unter der Tabelle */
        .data-footer {
            padding: 14px 24px;
            border-top: 1px solid var(--line-soft);
            font-size: 12.5px;
            color: var(--text-tertiary);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .data-footer a { color: var(--accent-strong); text-decoration: none; }
        .data-footer a:hover { text-decoration: underline; }

        @media (max-width: 720px) {
            .page-head .head-actions { margin-left: 0; width: 100%; }
            .table-container { padding: 4px 12px 12px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="wrap">
            <a href="index.html" class="wordmark">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4.4"/>
                        <ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)" opacity="0.55"/>
                    </svg>
                </span>
                <span><strong>Spacenations</strong><span class="thin"> Tools</span></span>
            </a>

            <nav class="header-auth">
                <a href="index.html" class="btn btn-ghost btn-sm">Alle Tools</a>
                <a href="https://beta4.game.spacenations.eu/" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Zum Spiel <span class="ext">↗</span></a>
            </nav>
        </div>
    </header>

    <main class="wrap tool-main">
        <div class="page-head">
            <span class="tool-icon tint-teal">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="9.5" ry="3.4" transform="rotate(-18 12 12)"/></svg>
            </span>
            <div>
                <h1>ProximaDB</h1>
                <p>Planetenverfolgung – aktualisiert sich automatisch alle 60 Sekunden.</p>
            </div>
            <div class="head-actions">
                <button class="btn btn-outline btn-sm refresh-btn">Aktualisieren</button>
            </div>
        </div>

        <div class="card data-card">
            <div id="content">
                <div class="loading">
                    <p>Lade Proxima-Daten...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = '/api/proxima';  // Server-Proxy - echte Spiel-API bleibt verborgen
        const AUTO_REFRESH_MS = 60000;
        const REQUEST_TIMEOUT_MS = 12000;

        let refreshTimerId = null;
        let backoffMs = AUTO_REFRESH_MS;

        function withTimeout(promise, ms) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), ms);
            return Promise.race([
                fetch(API_URL, { headers: { 'Accept': 'application/json' }, cache: 'no-store', signal: controller.signal }),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout nach ' + ms + ' ms')), ms))
            ]).finally(() => clearTimeout(id));
        }

        async function loadData() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading"><p>Lade Proxima-Daten...</p></div>';
            try {
                const response = await withTimeout(fetch(API_URL, { headers: { 'Accept': 'application/json' }, cache: 'no-store' }), REQUEST_TIMEOUT_MS);
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                const data = await response.json();
                displayData(data);
                backoffMs = AUTO_REFRESH_MS;
            } catch (error) {
                console.error('Fehler beim Laden der Daten:', error);
                content.innerHTML = `
                    <div class="error">
                        <h3>Fehler beim Laden der Daten</h3>
                        <p>Die Proxima-Daten konnten nicht geladen werden.</p>
                        <p><strong>Fehler:</strong> ${error.message}</p>
                        <p>Bitte versuchen Sie es später erneut oder kontaktieren Sie den Administrator.</p>
                        <button class="btn btn-outline btn-sm refresh-btn" onclick="manualRefresh()">Erneut versuchen</button>
                    </div>
                `;
                backoffMs = Math.min(Math.floor(backoffMs * 1.5), 120000);
            } finally {
                scheduleNextRefresh();
            }
        }

        function scheduleNextRefresh() {
            clearTimeout(refreshTimerId);
            if (document.visibilityState !== 'visible') return;
            refreshTimerId = setTimeout(() => loadData(), backoffMs);
        }

        function manualRefresh() {
            backoffMs = AUTO_REFRESH_MS;
            clearTimeout(refreshTimerId);
            loadData();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') scheduleNextRefresh();
            else clearTimeout(refreshTimerId);
        });
        window.addEventListener('pagehide', () => clearTimeout(refreshTimerId));

        function displayData(items) {
            if (!Array.isArray(items)) throw new Error('Ungültiges Datenformat');

            const planets = items.map(p => ({
                name: String(p.name ?? ''),
                coordinates: String(p.coordinates ?? ''),
                score: Number(p.score ?? 0),
                deleteOn: String(p.deleteOn ?? ''),
                weekNumber: extractWeekNumber(String(p.name ?? ''))
            }));

            const totalPlanets = planets.length;
            const weekNumbers = [...new Set(planets.map(p => p.weekNumber))].filter(n => Number.isFinite(n) && n > 0);
            const latestWeek = weekNumbers.length ? Math.max(...weekNumbers) : '-';

            planets.sort((a, b) => b.score - a.score);

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number">${totalPlanets}</div>
                        <div class="stat-label">Planeten</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${latestWeek}</div>
                        <div class="stat-label">Aktuelle Woche</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${new Date().toLocaleDateString('de-DE')}</div>
                        <div class="stat-label">Letzte Aktualisierung</div>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Koordinaten</th>
                                <th>Punkte</th>
                                <th>Tag der Zerstörung</th>
                                <th>Woche</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${planets.map(planet => `
                                <tr>
                                    <td><strong>${planet.name}</strong></td>
                                    <td><code>${planet.coordinates}</code></td>
                                    <td class="${getScoreClass(planet.score)}">${Number.isFinite(planet.score) ? planet.score.toLocaleString('de-DE') : ''}</td>
                                    <td>${formatDeleteDate(planet.deleteOn)}</td>
                                    <td><span class="week-badge">Woche ${planet.weekNumber || '-'}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="data-footer">
                    <span>Automatisch aktualisiert alle 60 Sekunden</span>
                    <span>Datenquelle: Spacenations API</span>
                </div>
            `;
        }

        function extractWeekNumber(planetName) {
            const match = planetName.match(/Proxima (\d+)-/);
            return match ? parseInt(match[1]) : 0;
        }

        function getScoreClass(score) {
            if (score >= 500) return 'score-high';
            if (score >= 200) return 'score-medium';
            return 'score-low';
        }

        function formatDeleteDate(deleteOnStr) {
            try {
                const date = new Date(deleteOnStr);
                if (isNaN(date.getTime())) return deleteOnStr;
                return date.toLocaleDateString('de-DE') + ' ' + date.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
            } catch (e) {
                return deleteOnStr;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            const headerBtn = document.querySelector('.refresh-btn');
            if (headerBtn) headerBtn.addEventListener('click', manualRefresh);
        });
    </script>

    <!-- Global Footer Loader -->
    <script src="js/global-footer-loader.js"></script>
</body>
</html>
