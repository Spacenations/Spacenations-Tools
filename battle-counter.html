<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Counter – Spacenations Tools</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181D'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.4' fill='none' stroke='%2300D68F' stroke-width='1.6' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/app.css?v=light-2">

    <style>
        /* Seitenspezifisch: Rechner mit Tab-Umschalter */
        .tool-main { padding-bottom: 64px; max-width: 980px; }

        .calc-card { margin-top: 22px; }

        /* Segment-Umschalter */
        .calculator-tabs {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            background: #F0F1F4;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .calc-tab {
            border: none;
            background: transparent;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: var(--font);
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        .calc-tab:hover { color: var(--text-primary); }

        .calc-tab.active {
            background: var(--card);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .calc-panel { display: none; }

        .calc-panel.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calc-panel h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .calc-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .calc-result {
            margin-top: 20px;
            border-radius: 12px;
            padding: 18px 20px;
            display: none;
            border: 1px solid rgba(0, 168, 120, 0.3);
            background: var(--accent-soft);
            color: var(--accent-strong);
        }

        .calc-result.show { display: block; animation: fadeIn 0.25s ease; }

        .calc-result.error {
            border-color: rgba(217, 48, 37, 0.25);
            background: var(--danger-soft);
            color: var(--danger);
        }

        .result-main {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .result-breakdown {
            background: var(--card);
            border: 1px solid var(--line-soft);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 13.5px;
            line-height: 1.8;
            color: var(--text-secondary);
            text-align: left;
        }

        .result-breakdown strong { color: var(--text-primary); }

        /* Beispiele */
        .calc-examples {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--line-soft);
        }

        .calc-examples h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .example-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 720px) {
            .calculator-tabs { width: 100%; }
            .calc-tab { flex: 1; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="wrap">
            <a href="index.html" class="wordmark">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4.4"/>
                        <ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)" opacity="0.55"/>
                    </svg>
                </span>
                <span><strong>Spacenations</strong><span class="thin"> Tools</span></span>
            </a>

            <nav class="header-auth">
                <a href="index.html" class="btn btn-ghost btn-sm">Alle Tools</a>
                <a href="https://beta4.game.spacenations.eu/" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Zum Spiel <span class="ext">↗</span></a>
            </nav>
        </div>
    </header>

    <main class="wrap tool-main">
        <div class="page-head">
            <span class="tool-icon tint-blue">
                <svg viewBox="0 0 24 24"><path d="M12 3.2l6.8 2.8v4.9c0 4.4-2.9 7.4-6.8 8.9-3.9-1.5-6.8-4.5-6.8-8.9V6l6.8-2.8z"/></svg>
            </span>
            <div>
                <h1>Battle Counter</h1>
                <p>Benötigte Angriffspunkte oder Stabilitätsabschuss berechnen.</p>
            </div>
        </div>

        <div class="card calc-card">
            <div class="calculator-tabs">
                <button class="calc-tab active" onclick="switchCalculatorTab('reverse')">
                    AS ermitteln
                </button>
                <button class="calc-tab" onclick="switchCalculatorTab('forward')">
                    Stabilitätsabschuss
                </button>
            </div>

            <!-- AS Ermitteln (Rückwärtsrechnung) -->
            <div id="reverse-calc" class="calc-panel active">
                <h3>Wie viele Angriffspunkte werden benötigt?</h3>
                <div class="calc-inputs">
                    <div class="field">
                        <label for="reverse-stability">Stabilitätsverlust</label>
                        <input type="number" id="reverse-stability" placeholder="z.B. 156897" min="0">
                    </div>
                    <div class="field">
                        <label for="reverse-armor">Panzerung des Ziels</label>
                        <input type="number" id="reverse-armor" placeholder="z.B. 3241" min="0">
                    </div>
                    <div class="field">
                        <label for="reverse-duration">Kampfdauer (Sekunden)</label>
                        <input type="number" id="reverse-duration" placeholder="z.B. 78" min="1" max="3600">
                    </div>
                </div>
                <button class="btn btn-accent btn-md" onclick="calculateReverse()">
                    Angriffspunkte berechnen
                </button>
                <div id="reverse-result" class="calc-result"></div>
            </div>

            <!-- Stabilitätsabschuss (Vorwärtsrechnung) -->
            <div id="forward-calc" class="calc-panel">
                <h3>Wie viel Stabilität geht verloren?</h3>
                <div class="calc-inputs">
                    <div class="field">
                        <label for="forward-attack">Angriffspunkte (AS)</label>
                        <input type="number" id="forward-attack" placeholder="z.B. 25000" min="0">
                    </div>
                    <div class="field">
                        <label for="forward-armor">Panzerung des Ziels</label>
                        <input type="number" id="forward-armor" placeholder="z.B. 3241" min="0">
                    </div>
                    <div class="field">
                        <label for="forward-duration">Kampfdauer (Sekunden)</label>
                        <input type="number" id="forward-duration" placeholder="z.B. 78" min="1" max="3600">
                    </div>
                </div>
                <button class="btn btn-accent btn-md" onclick="calculateForward()">
                    Stabilitätsabschuss berechnen
                </button>
                <div id="forward-result" class="calc-result"></div>
            </div>

            <!-- Beispiele -->
            <div class="calc-examples">
                <h4>Beispiele zum Ausprobieren</h4>
                <div class="example-buttons">
                    <button class="btn btn-outline btn-sm example-btn" onclick="loadExample(1)">
                        Beispiel 1: 156k Stabilität
                    </button>
                    <button class="btn btn-outline btn-sm example-btn" onclick="loadExample(2)">
                        Beispiel 2: 832k Stabilität
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Global Footer wird automatisch geladen -->

    <!-- Scripts -->
    <script src="js/battle-calculator.js"></script>
    <script src="js/global-footer-loader.js"></script>

    <script>
        // Battle Calculator Functions
        let battleCalc = null;

        function initializeBattleCalculator() {
            if (window.BattleCalculator) {
                battleCalc = new window.BattleCalculator(3600);
                console.log('🧮 Battle-Counter initialisiert');
            } else {
                console.warn('⚠️ BattleCalculator noch nicht geladen');
                setTimeout(initializeBattleCalculator, 100);
            }
        }

        function switchCalculatorTab(tabName) {
            // Tab-Buttons aktualisieren
            document.querySelectorAll('.calc-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Panels aktualisieren
            document.querySelectorAll('.calc-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            document.getElementById(tabName + '-calc').classList.add('active');

            // Ergebnisse verstecken
            hideAllResults();
        }

        function hideAllResults() {
            document.querySelectorAll('.calc-result').forEach(result => {
                result.classList.remove('show');
            });
        }

        function showResult(elementId, content, isError = false) {
            const resultElement = document.getElementById(elementId);
            resultElement.innerHTML = content;
            resultElement.className = 'calc-result show' + (isError ? ' error' : '');
        }

        function calculateForward() {
            if (!battleCalc) {
                showResult('forward-result', '❌ Kampfrechner noch nicht geladen. Bitte versuchen Sie es erneut.', true);
                return;
            }

            const attack = parseFloat(document.getElementById('forward-attack').value);
            const armor = parseFloat(document.getElementById('forward-armor').value);
            const duration = parseFloat(document.getElementById('forward-duration').value);

            const validation = battleCalc.validateInputs({
                'Angriffspunkte': attack,
                'Panzerung': armor,
                'Kampfdauer': duration
            });

            if (!validation.isValid) {
                showResult('forward-result', '❌ ' + validation.errors.join('<br>❌ '), true);
                return;
            }

            if (duration > 3600) {
                showResult('forward-result', '❌ Kampfdauer darf nicht größer als 3600 Sekunden (60 Minuten) sein.', true);
                return;
            }

            const stabilityLoss = battleCalc.stabilityLoss(attack, armor, duration);
            const effectiveAttack = battleCalc.calculateEffectiveAttack(attack, armor);

            let resultHtml = `
                <div class="result-main">
                    <strong>Stabilitätsverlust: ${battleCalc.formatNumber(stabilityLoss, 0)}</strong>
                </div>
                <div class="result-breakdown">
                    <strong>Detaillierte Berechnung:</strong><br>
                    • Angriffspunkte: ${battleCalc.formatNumber(attack, 0)}<br>
                    • Panzerung: ${battleCalc.formatNumber(armor, 0)}<br>
                    • Effektiver Angriff: ${battleCalc.formatNumber(effectiveAttack, 0)}<br>
                    • Kampfdauer: ${duration} Sekunden<br><br>
                    <strong>Formel:</strong> (${battleCalc.formatNumber(effectiveAttack, 0)} ÷ 3600) × ${duration} = ${battleCalc.formatNumber(stabilityLoss, 0)}
                </div>
            `;

            if (effectiveAttack <= 0) {
                resultHtml = `
                    <div class="result-main">
                        <strong>Kein Schaden möglich!</strong>
                    </div>
                    <div class="result-breakdown">
                        Die Panzerung (${battleCalc.formatNumber(armor, 0)}) ist größer oder gleich den Angriffspunkten (${battleCalc.formatNumber(attack, 0)}).<br>
                        Es kann kein Schaden verursacht werden.
                    </div>
                `;
            }

            showResult('forward-result', resultHtml);
        }

        function calculateReverse() {
            console.log('🧮 calculateReverse() aufgerufen');
            if (!battleCalc) {
                console.error('❌ battleCalc ist nicht initialisiert');
                showResult('reverse-result', '❌ Kampfrechner noch nicht geladen. Bitte versuchen Sie es erneut.', true);
                return;
            }
            console.log('✅ battleCalc ist verfügbar');

            const stability = parseFloat(document.getElementById('reverse-stability').value);
            const armor = parseFloat(document.getElementById('reverse-armor').value);
            const duration = parseFloat(document.getElementById('reverse-duration').value);

            const validation = battleCalc.validateInputs({
                'Stabilitätsverlust': stability,
                'Panzerung': armor,
                'Kampfdauer': duration
            });

            if (!validation.isValid) {
                showResult('reverse-result', '❌ ' + validation.errors.join('<br>❌ '), true);
                return;
            }

            if (duration > 3600) {
                showResult('reverse-result', '❌ Kampfdauer darf nicht größer als 3600 Sekunden (60 Minuten) sein.', true);
                return;
            }

            const requiredAttack = battleCalc.requiredAttack(stability, armor, duration);
            const effectiveAttack = requiredAttack - armor;

            let resultHtml = `
                <div class="result-main">
                    <strong>Benötigte Angriffspunkte: ${battleCalc.formatNumber(requiredAttack, 0)}</strong>
                </div>
                <div class="result-breakdown">
                    <strong>Detaillierte Berechnung:</strong><br>
                    • Stabilitätsverlust: ${battleCalc.formatNumber(stability, 0)}<br>
                    • Panzerung des Ziels: ${battleCalc.formatNumber(armor, 0)}<br>
                    • Kampfdauer: ${duration} Sekunden<br>
                    • Effektiver Angriff benötigt: ${battleCalc.formatNumber(effectiveAttack, 0)}<br><br>
                    <strong>Formel:</strong> (${battleCalc.formatNumber(stability, 0)} × 3600 ÷ ${duration}) + ${battleCalc.formatNumber(armor, 0)} = ${battleCalc.formatNumber(requiredAttack, 0)}
                </div>
            `;

            showResult('reverse-result', resultHtml);
        }


        function loadExample(exampleNumber) {
            console.log('📝 loadExample() aufgerufen mit Nummer:', exampleNumber);
            hideAllResults();

            if (exampleNumber === 1) {
                // Beispiel 1: 156.897 Stabilität und 3.241 Panzer in 78 Sekunden
                document.getElementById('reverse-stability').value = '156897';
                document.getElementById('reverse-armor').value = '3241';
                document.getElementById('reverse-duration').value = '78';

                // Stelle sicher, dass AS Ermitteln Tab aktiv ist
                document.querySelectorAll('.calc-tab').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.calc-panel').forEach(panel => panel.classList.remove('active'));
                document.querySelectorAll('.calc-tab')[0].classList.add('active');
                document.getElementById('reverse-calc').classList.add('active');

                setTimeout(() => calculateReverse(), 300);

            } else if (exampleNumber === 2) {
                // Beispiel 2: Flotte mit 832.312 Stabilität und 12.324 Panzer, Dauer 100 Sek.
                document.getElementById('reverse-stability').value = '832312';
                document.getElementById('reverse-armor').value = '12324';
                document.getElementById('reverse-duration').value = '100';

                // Stelle sicher, dass AS Ermitteln Tab aktiv ist
                document.querySelectorAll('.calc-tab').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.calc-panel').forEach(panel => panel.classList.remove('active'));
                document.querySelectorAll('.calc-tab')[0].classList.add('active');
                document.getElementById('reverse-calc').classList.add('active');

                setTimeout(() => calculateReverse(), 300);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initializeBattleCalculator();

            // Enter-Taste Support für Eingabefelder
            document.querySelectorAll('.calc-panel input').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const panel = this.closest('.calc-panel');
                        const button = panel.querySelector('.btn-accent');
                        if (button) button.click();
                    }
                });
            });
        });
    </script>
</body>
</html>
